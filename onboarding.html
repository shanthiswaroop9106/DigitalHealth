<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Health Information | HealthSync</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="container nav-wrap">
        <a class="brand" href="index.html">
          <span class="brand-mark">H</span>
          <span data-i18n="brand">HealthSync</span>
        </a>

        <button class="nav-toggle" aria-label="Toggle menu">☰</button>

        <nav class="main-nav">
          <a href="index.html" data-i18n="navHome">Home</a>
          <a href="dashboard.html" data-i18n="navDashboard">Dashboard</a>
          <a href="diet.html" data-i18n="navDiet">Diet</a>
          <a href="activities.html" data-i18n="navActivities">Activities</a>
          <a href="progress.html" data-i18n="navProgress">Progress</a>
          <a href="ai.html" data-i18n="navAssistant">AI Assistant</a>
          <a href="profile.html" data-i18n="navProfile">Profile</a>
        </nav>

        <div class="nav-actions">
          <label class="language-picker">
            <span>🌐</span>
            <select data-language aria-label="Select language">
              <option value="en">English</option>
              <option value="te">తెలుగు</option>
              <option value="hi">हिन्दी</option>
            </select>
          </label>
          <a class="btn btn-outline" href="login.html" data-i18n="navLogin">Login</a>
          <a class="btn btn-primary" href="signup.html" data-i18n="navSignup">Sign Up</a>
        </div>
      </div>
    </header>

    <main class="onboarding-layout">
      <div class="onboarding-card">
        <div class="section-head" style="margin-bottom: 20px;">
          <span class="kicker">Setup</span>
          <h2 data-i18n="onboardingTitle">Tell us about your health journey</h2>
        </div>

        <div class="progress-steps">
          <span class="step-pill active">1. Basics</span>
          <span class="step-pill">2. Lifestyle</span>
          <span class="step-pill">3. Goals</span>
        </div>

        <form id="onboardingForm">
          <div class="form-grid">
            <div class="field">
              <label for="age">Age</label>
              <input id="age" name="age" type="number" min="1" max="120" />
            </div>

            <div class="field">
              <label for="gender">Gender</label>
              <select id="gender" name="gender">
                <option value="" selected>Select</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
              </select>
            </div>

            <div class="field">
              <label for="height">Height (cm)</label>
              <input id="height" name="height" type="number" min="30" max="300" step="0.1" />
            </div>

            <div class="field">
              <label for="weight">Weight (kg)</label>
              <input id="weight" name="weight" type="number" min="1" max="700" step="0.1" />
            </div>

            <div class="field">
              <label for="diabetes-type">Diabetes type</label>
              <select id="diabetes-type" name="diabetesCategory">
                <option value="Not specified" selected>Not specified</option>
                <option value="Type 1">Type 1</option>
                <option value="Type 2">Type 2</option>
                <option value="Prediabetes">Prediabetes</option>
                <option value="Gestational">Gestational</option>
              </select>
            </div>

            <div class="field">
              <label for="activity">Activity level</label>
              <select id="activity" name="activityLevel">
                <option value="Not specified" selected>Not specified</option>
                <option value="Low">Low</option>
                <option value="Moderate">Moderate</option>
                <option value="High">High</option>
              </select>
            </div>

            <div class="field">
              <label for="lifestyle">Lifestyle pattern</label>
              <select id="lifestyle" name="lifestyle">
                <option value="Not provided" selected>Not provided</option>
                <option value="Remote work and flexible routine">Remote work and flexible routine</option>
                <option value="Office schedule with short movement breaks">Office schedule with short movement breaks</option>
                <option value="Busy family schedule">Busy family schedule</option>
                <option value="Travel-heavy routine">Travel-heavy routine</option>
              </select>
            </div>

            <div class="field">
              <label for="food-preferences">Food preferences</label>
              <select id="food-preferences" name="foodPreferences">
                <option value="Not provided" selected>Not provided</option>
                <option value="Vegetarian">Vegetarian</option>
                <option value="Low sugar">Low sugar</option>
                <option value="High protein">High protein</option>
                <option value="Mediterranean">Mediterranean</option>
                <option value="Balanced and flexible">Balanced and flexible</option>
              </select>
            </div>

            <div class="field" style="grid-column: 1 / -1;">
              <label for="health-conditions">Health conditions</label>
              <textarea id="health-conditions" name="healthConditions" rows="3"></textarea>
            </div>

            <div class="field" style="grid-column: 1 / -1;">
              <label for="goals">Lifestyle goals</label>
              <textarea id="goals" name="goals" rows="3"></textarea>
            </div>

            <div class="field" style="grid-column: 1 / -1;">
              <label for="notes">Health notes</label>
              <textarea id="notes" name="notes" rows="4"></textarea>
            </div>
          </div>

          <div class="form-row" style="margin-top: 28px;">
            <a class="btn btn-outline" href="dashboard.html">Skip for now</a>
            <button class="btn btn-primary" type="submit">Continue</button>
          </div>
          <div class="form-status"></div>
        </form>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <div><strong>HealthSync</strong></div>
        <p>© <span id="year"></span> HealthSync</p>
      </div>
    </footer>

    <script src="translations.js"></script>
    <script src="script.js"></script>
  </body>
</html>
